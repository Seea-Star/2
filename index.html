<!DOCTYPE html>
<html>
  <head>
    <script src="/.nekoweb-api/static/site.js" defer=""></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
      body {
        background-color: #f5f5f7;
        background-image: 
          linear-gradient(#e1e1e6 1px, transparent 1px),
          linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
        background-size: 20px 20px;
        margin: 0;
        padding: 0;
        font-family: 'Quicksand', sans-serif;
      }
    
      .mainbox {
        width: 650px;
        height: 430px;
        display: flex;
      }

      .infobox {
        height: 100%; 
        width: 220px; 
        display: flex; 
        flex-direction: column; 
        padding-top: 10px;
        padding-bottom: 10px;
        box-sizing: border-box;
      }

      /* BOX NOME PROPRIETARIO CON LINK */
      .roomowner {
        background-color: #111111;
        width: 100%;
        border-radius: 12px;
        box-shadow: 2px 2px 0px #F3EEDA;
        padding: 6px 10px;
        box-sizing: border-box;
        margin-bottom: 8px;
        text-align: center;
      }

      .roomowner a {
        color: #ffffff !important;
        text-decoration: none;
        font-weight: 800;
        font-size: 13px;
        display: block;
        cursor: pointer;
      }

      /* TITOLI SEZIONI */
      .infoboxtitle {
        background-color: #F3EEDA;
        color: #111111;
        border: 1.5px solid #111111;
        border-radius: 8px;
        width: fit-content;
        box-sizing: border-box;
        padding: 1px 7px;
        margin-bottom: 2px;
        font-size: 10px;
        font-weight: 800;
      }

      /* CASELLE DI TESTO REGOLATE PER LA LEGGIBILITÀ */
      .infoboxspace {
        width: 100%;
        min-height: 22px;
        background-color: #ffffff;
        color: #111111;
        border: 1.5px solid #111111;
        border-radius: 8px;
        margin-bottom: 6px;
        box-sizing: border-box;
        padding: 2px 6px;
        overflow: hidden;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.3;
        display: flex;
        align-items: center;
      }

      .itemspace {
        width: 100%;
        height: 55px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      /* CASELLE DEGLI OGGETTI (ITEMS) */
      .itembox {
        height: 48px;
        width: 48px;
        background-color: #ffffff;
        border: 1.5px solid #111111;
        border-radius: 8px;
        box-shadow: 1.5px 1.5px 0px #111111;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        padding: 3px;
      }

      .itembox img {
        width: 100%;
        height: auto;
      }

      /* CONTENITORE STANZA SENZA BORDI */
      .roombox {
        width: 400px;
        height: 353px;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .roombox img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        border: none;
      }

      html {
        cursor: url(https://file.garden/ZmFfhSOgiFXI9ZBU/cursors/tomodachi-life-hand.png), auto;
      }
    </style>
  </head>
  <body>
    <div class="mainbox">
      <div style="height: 100%; margin-left: 10px; display: flex; align-items: center; margin-right: 10px;">
        <div class="roombox">
          <!-- SOSTITUISCI room.png CON IL LINK DELLA TUA STANZA SU NEOCITIES -->
          <img src="https://cosmic-seea.neocities.org/room.png" alt="Seea's Room" />
        </div>
      </div>
      <div class="infobox">
        <div class="roomowner">
          <a href="https://cosmic-seea.neocities.org/" target="_parent">Seea (Seea Star)</a>
        </div>
        
        <div class="infoboxtitle">
          MOVED ON
        </div>
        <div class="infoboxspace">
          30 Sept 2025
        </div>

        <div class="infoboxtitle">
          LIKES
        </div>
        <div class="infoboxspace" style="margin-bottom: 2px;">
          Space & Pixel art ✧
        </div>
        <div class="infoboxspace" style="margin-bottom: 2px;">
          Cozy web aesthetics
        </div>
        <div class="infoboxspace">
          Music & Stationery
        </div>

        <div class="infoboxtitle">
          REASON FOR MOVING IN
        </div>
        <div class="infoboxspace" style="min-height: 42px;">
          To share my cozy universe!
        </div>

        <div class="infoboxtitle">
          FAVORITE PART OF LIVING HERE
        </div>
        <div class="infoboxspace" style="min-height: 42px;">
          Meeting cool webmasters.
        </div>

        <div class="infoboxtitle">
          ITEMS
        </div>
        <div class="itemspace">
          <div class="itembox" id="item1"></div>
          <div class="itembox" id="item2"></div>
          <div class="itembox" id="item3"></div>
          <div class="itembox" id="item4"></div>
        </div>
      </div>
    </div>
  </body>
</html>
