<!DOCTYPE html>
<html>
  <head>
    <script src="/.nekoweb-api/static/site.js" defer=""></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
      body {
        background-color: #f5f5f7;
        background-image: 
          linear-gradient(#e1e1e6 1px, transparent 1px),
          linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
        background-size: 20px 20px;
        margin: 0;
        padding: 0;
        font-family: 'Quicksand', sans-serif;
      }
    
      .mainbox {
        width: 650px;
        height: 430px;
        display: flex;
      }

      .infobox {
        height: 100%; 
        width: 220px; 
        display: flex; 
        flex-direction: column; 
        padding-top: 10px;
        padding-bottom: 10px;
        box-sizing: border-box;
      }

      .roomowner {
        background-color: #a7c8b8;
        width: 100%;
        box-shadow: 2px 2px 0px 0px white inset, -2px -2px 0px 0px #6fa590 inset;
        padding: 5px 10px;
        box-sizing: border-box;
        margin-bottom: 10px;
        font-weight: 700;
      }

      .infoboxtitle {
        background-color: #fc6d27;
        color: white;
        border-radius: 10px;
        width: fit-content;
        box-sizing: border-box;
        padding: 0px 5px;
        margin-bottom: 3px;
        font-size: 12px;
        font-weight: 700;
      }

      .infoboxspace {
        width: 100%;
        height: 20px;
        background-color: white;
        border-radius: 10px;
        margin-bottom: 10px;
        box-shadow: 0px 1px 0px 1px #7d8578 inset, 0px -2px 0px 0px white inset;
        box-sizing: border-box;
        padding: 5px;
        overflow: scroll;
        font-size: 12px;
        font-weight: 600;
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      .infoboxspace::-webkit-scrollbar {
        display: none;
      }

      .itemspace {
        width: 100%;
        height: 55px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .itembox {
        height: 50px;
        width: 50px;
        background-color: #8f9087;
        border-radius: 5px;
        box-shadow: 0px 2px 0px 1px #7d8578 inset, 0px -2px 0px 0px white inset;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        padding: 5px;
      }

      .itembox img {
        width: 100%;
        height: auto;
      }

      .roombox {
        width: 400px;
        height: 353px;
      }

      .roombox img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      html {
        cursor: url(https://file.garden/ZmFfhSOgiFXI9ZBU/cursors/tomodachi-life-hand.png), auto;
      }
    
      .roomowner a {
        all: unset;
        cursor: url(https://file.garden/ZmFfhSOgiFXI9ZBU/cursors/tomodachi-life-point.png), auto;
      }
    </style>
  </head>
  <body>
    <div class="mainbox">
      <div style="height: 100%; margin-left: 10px; display: flex; align-items: center; margin-right: 10px;">
        <div class="roombox">
          <img src="https://cosmic-seea.neocities.org/tuo-file-stanza.png" />
        </div>
      </div>
      <div class="infobox">
        <div class="roomowner">
          <a href="https://cosmic-seea.neocities.org" target="parent">COSMIC-S</a>
        </div>
        
        <div class="infoboxtitle">
          MOVED ON
        </div>
        <div class="infoboxspace" style="padding: 4px 5px">
          30 Sept 2025
        </div>

        <div class="infoboxtitle">
          LIKES
        </div>
        <div class="infoboxspace" style="margin-bottom: 3px;">
          Space & Pixel art ✧
        </div>
        <div class="infoboxspace" style="margin-bottom: 3px;">
          Cozy web aesthetics
        </div>
        <div class="infoboxspace">
          Music & Stationery
        </div>

        <div class="infoboxtitle">
          REASON FOR MOVING IN
        </div>
        <div class="infoboxspace" style="height: 50px;">
          To share my cozy universe!
        </div>

        <div class="infoboxtitle">
          FAVORITE PART OF LIVING HERE
        </div>
        <div class="infoboxspace" style="height: 50px;">
          Meeting cool webmasters.
        </div>

        <div class="infoboxtitle">
          ITEMS
        </div>
        <div class="itemspace">
          <div class="itembox" id="item1"></div>
          <div class="itembox" id="item2"></div>
          <div class="itembox" id="item3"></div>
          <div class="itembox" id="item4"></div>
        </div>
      </div>
    </div>
  </body>
</html>
