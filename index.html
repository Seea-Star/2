<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - LOST IN SPACE | COSMIC-S</title>
  <link rel="icon" type="image/png" href="https://cosmic-seea.neocities.org/stamp-5.png">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .error-card {
      max-width: 500px;
      width: 100%;
      background: #111111;
      color: #ffffff;
      border: 3px solid #111111;
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 6px 6px 0px #F3EEDA;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .pixel-code {
      font-family: 'Press Start 2P', monospace;
      font-size: 2.5rem;
      color: #F3EEDA;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(243, 238, 218, 0.5);
    }

    .error-title {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .error-msg {
      font-size: 0.85rem;
      color: #cccccc;
      line-height: 1.4;
    }

    /* Pulsante stile COSMIC-S */
    .btn-home {
      background: #F3EEDA;
      color: #111111;
      border: 2px solid #111;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 800;
      font-size: 0.85rem;
      text-decoration: none;
      box-shadow: 3px 3px 0px #ffffff;
      transition: transform 0.1s ease;
      display: inline-block;
      margin-top: 10px;
    }

    .btn-home:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #ffffff;
    }

    .btn-home:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0px #ffffff;
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="pixel-code">404</div>
    
    <!-- Puoi sostituire o aggiungere un'immagine/GIF speciale qui -->
    <div style="font-size: 2rem;">🚀 💫</div>

    <div class="error-title">LOST IN SPACE!</div>
    <p class="error-msg">
      Ops! La pagina che stavi cercando non esiste o è stata spostata in un'altra galassia.
    </p>

    <!-- Usa un link assoluto (completo) per farlo funzionare ovunque -->
    <a href="https://cosmic-seea.neocities.org/" class="btn-home">
      ← RETURN TO HOME
    </a>
  </div>

</body>
</html>
